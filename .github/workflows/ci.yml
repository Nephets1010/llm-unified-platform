name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src tests

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest tests/ -v --tb=short --junitxml=test-results.xml
        env:
          LLM_JWT_SECRET: test-secret-for-ci
          LLM_ENVIRONMENT: dev
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f deploy/Dockerfile -t llm-platform:${{ github.sha }} .
      - name: Verify image
        run: docker run --rm llm-platform:${{ github.sha }} python -c "from llm_platform.main import create_app; create_app(); print('OK')"

  # 分支保护与徽章说明：
  # 1. 在 GitHub Settings → Branches → main 设置 "Require status checks to pass before merging"
  # 2. 必需 checks: lint, test, gitleaks
  # 3. 徽章：![CI](https://github.com/<org>/<repo>/actions/workflows/ci.yml/badge.svg)
